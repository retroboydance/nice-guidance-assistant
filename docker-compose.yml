services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nice_bat_backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/nice_bat.db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nice_bat_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
