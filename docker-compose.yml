services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nice_bat_backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/nice_bat.db
      # Optional: Explicit base URL for magic links. If unset, automatically detects the IP/domain you use in your browser!
      # - APP_BASE_URL=http://10.45.2.123:8080
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nice_bat_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
